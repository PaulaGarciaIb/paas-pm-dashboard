<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control PM - Evaluación PaaS</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 15px; }
        
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eaeaea; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-title h1 { margin: 0; font-size: 22px; color: #2c3e50; }
        .header-title p { margin: 3px 0 0 0; font-size: 13px; color: #7f8c8d; }
        
        .user-profile { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 6px 12px; border-radius: 20px; border: 1px solid #e2e8f0; }
        .avatar { width: 34px; height: 34px; background: #3498db; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 13px; font-weight: bold; color: #2c3e50; }
        .user-role { font-size: 11px; color: #7f8c8d; }

        .status-bar { margin: 15px 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .status-badge { display: inline-block; background: #2ecc71; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 15px 0; }
        .card { background: #ebf5fb; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db; }
        .card h3 { margin: 0 0 5px 0; font-size: 11px; color: #7f8c8d; text-transform: uppercase; }
        .card p { margin: 0; font-size: 22px; font-weight: bold; color: #2c3e50; }

        .add-box { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .add-box input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .add-box button { background: #3498db; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .add-box button:hover { background: #2980b9; }

        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #f8f9fa; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e9ecef; font-size: 14px; }
        li.completed { background: #e8f8f5; border-color: #d4efdf; }
        li.completed .task-text { text-decoration: line-through; color: #7f8c8d; }

        .task-left { display: flex; align-items: center; gap: 12px; }
        .task-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .delete-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 4px; }
        .delete-btn:hover { background: #fadbd8; }

        .timer { margin-top: 20px; font-size: 12px; color: #7f8c8d; background: #f8f9fa; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #edf2f7; }

        @media (max-width: 500px) {
            .container { padding: 15px; }
            .header-title h1 { font-size: 18px; }
            .add-box button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <h1>📊 Panel de Gestión de Proyecto</h1>
                <p>Asignatura: GSASD - EPS Córdoba</p>
            </div>
            <div class="user-profile">
                <div class="avatar">PG</div>
                <div class="user-info">
                    <span class="user-name">Paula García</span>
                    <span class="user-role">PM</span>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span><strong>Estado Infraestructura:</strong></span>
            <span class="status-badge">ONLINE</span>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Progreso General</h3>
                <p id="progreso">0%</p>
            </div>
            <div class="card">
                <h3>Sprint Actual</h3>
                <p id="tareasCount">0 / 0</p>
            </div>
        </div>

        <h3>Añadir nueva tarea al Sprint:</h3>
        <div class="add-box">
            <input type="text" id="taskInput" placeholder="Ej: Comprobar respuesta en Vercel..." />
            <button onclick="agregarTarea()">Añadir Tarea</button>
        </div>

        <h3>Tareas del Proyecto:</h3>
        <ul id="taskList"></ul>

        <div class="timer">
            ⏱️ <strong>Respuesta Backend PaaS:</strong> <span id="timestamp">Consultando...</span>
        </div>
    </div>

    <script>
        const tareasIniciales = [
            { id: 1, texto: 'Definición de requisitos del sistema y SLA', completada: true },
            { id: 2, texto: 'Configuración del repositorio remoto en GitHub', completada: true },
            { id: 3, texto: 'Pruebas de latencia y Cold Start en Render', completada: false },
            { id: 4, texto: 'Auditoría de despliegue en Vercel y Railway', completada: false }
        ];

        function obtenerTareasLocal() {
            const guardadas = localStorage.getItem('paas_pm_tareas');
            if (guardadas) {
                return JSON.parse(guardadas);
            }
            localStorage.setItem('paas_pm_tareas', JSON.stringify(tareasIniciales));
            return tareasIniciales;
        }

        function guardarTareasLocal(tareas) {
            localStorage.setItem('paas_pm_tareas', JSON.stringify(tareas));
        }

        function renderizar() {
            const tareas = obtenerTareasLocal();
            const total = tareas.length;
            const completadas = tareas.filter(t => t.completada).length;
            const progreso = total > 0 ? Math.round((completadas / total) * 100) : 0;

            document.getElementById('progreso').textContent = progreso + '%';
            document.getElementById('tareasCount').textContent = `${completadas} / ${total}`;

            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tareas.forEach(t => {
                const li = document.createElement('li');
                if (t.completada) li.classList.add('completed');
                
                li.innerHTML = `
                    <div class="task-left">
                        <input type="checkbox" class="task-checkbox" ${t.completada ? 'checked' : ''} onchange="toggleTarea(${t.id})">
                        <span class="task-text">${t.texto}</span>
                    </div>
                    <button class="delete-btn" onclick="eliminarTarea(${t.id})" title="Eliminar tarea">🗑️</button>
                `;
                list.appendChild(li);
            });
        }

        function cargarEstado() {
            const startTime = performance.now();
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    const endTime = performance.now();
                    const latency = Math.round(endTime - startTime);
                    document.getElementById('timestamp').textContent = `${data.servidorTimestamp} (Latencia: ${latency} ms)`;
                })
                .catch(() => {
                    document.getElementById('timestamp').textContent = 'Error de conexión con el servidor PaaS';
                });

            renderizar();
        }

        function agregarTarea() {
            const input = document.getElementById('taskInput');
            const texto = input.value.trim();
            if (!texto) return;

            const tareas = obtenerTareasLocal();
            tareas.push({ id: Date.now(), texto, completada: false });
            guardarTareasLocal(tareas);

            fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto })
            });

            input.value = '';
            renderizar();
        }

        function toggleTarea(id) {
            const tareas = obtenerTareasLocal();
            const tarea = tareas.find(t => t.id === Number(id));
            if (tarea) {
                tarea.completada = !tarea.completada;
                guardarTareasLocal(tareas);

                fetch(`/api/tasks/${id}/toggle`, { method: 'PUT' });

                renderizar();
            }
        }

        function eliminarTarea(id) {
            let tareas = obtenerTareasLocal();
            tareas = tareas.filter(t => t.id !== Number(id));
            guardarTareasLocal(tareas);

            fetch(`/api/tasks/${id}`, { method: 'DELETE' });

            renderizar();
        }

        cargarEstado();
    </script>
</body>
</html>
